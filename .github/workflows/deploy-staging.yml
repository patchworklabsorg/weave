name: Deploy staging

# Build the image and roll it out to weave-staging.patchworklabs.org on every
# push to main. Production stays manual (deploy.yml / bin/deploy-local).
#
# Staging is the same image as production running as separate containers on
# alastor (infra: the weave-staging module), with WEAVE_ENV=staging and
# APP_HOST=weave-staging.patchworklabs.org. This workflow writes the new image
# ref and restarts the systemd service, which re-pulls and runs
# `bin/rails db:prepare` on start.
#
# The deploy step fails until the infra side is deployed: it needs
# /var/lib/weave-staging/ and sudo rights on weave-staging-web for the
# weave-deploy user.
#
# Uses the same repository secrets as deploy.yml:
#   ALASTOR_HOST          - alastor's SSH host / IP
#   WEAVE_DEPLOY_SSH_KEY  - private key for the weave-deploy user on alastor
# (GITHUB_TOKEN is used automatically to push to ghcr.io.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-weave-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Native arm64 runner for the aarch64 host; see deploy.yml.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/patchworklabsorg/weave:staging
            ghcr.io/patchworklabsorg/weave:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to alastor (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALASTOR_HOST }}
          username: weave-deploy
          key: ${{ secrets.WEAVE_DEPLOY_SSH_KEY }}
          script: |
            echo "ghcr.io/patchworklabsorg/weave:${{ github.sha }}" > /var/lib/weave-staging/image-ref
            sudo systemctl restart weave-staging-web
