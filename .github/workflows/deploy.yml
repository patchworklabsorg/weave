name: Deploy

# Build the image, push to ghcr.io, and restart the weave-web service on alastor.
# The NixOS module (infra: modules/weave) runs the container; this workflow just
# writes the new image ref and restarts the systemd service, which re-pulls and
# runs `bin/rails db:prepare` on start.
#
# Required repository secrets:
#   ALASTOR_HOST          - alastor's SSH host / IP
#   WEAVE_DEPLOY_SSH_KEY  - private key for the weave-deploy user on alastor
# (GITHUB_TOKEN is used automatically to push to ghcr.io.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-weave
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/patchworklabsorg/idp:main
            ghcr.io/patchworklabsorg/idp:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to alastor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALASTOR_HOST }}
          username: weave-deploy
          key: ${{ secrets.WEAVE_DEPLOY_SSH_KEY }}
          script: |
            echo "ghcr.io/patchworklabsorg/idp:${{ github.sha }}" > /var/lib/weave/image-ref
            sudo systemctl restart weave-web
