<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found (404) · Weave</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/geist-400-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/geist-600-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Shantell Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/shantell-sans-600-latin.woff2") format("woff2");
      }

      @font-face {
        font-family: "Shantell Sans";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/shantell-sans-700-latin.woff2") format("woff2");
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      :root {
        --quilt: #f7f5fb;
        --paper: #fefdff;
        --ink: #2a2050;
        --ink-soft: #5d5584;
        --ink-faint: #8a83a8;
        --grape: #6c3ec1;
        --violet: #9b7fd4;
        --orchid: #a44fc8;
        --sky: #2f7cd6;
        --teal: #2aa187;
        --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-display: "Shantell Sans", "Geist", ui-sans-serif, sans-serif;
      }

      body {
        font-family: var(--font-sans);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: var(--quilt);
        background-image:
          repeating-linear-gradient(45deg,  rgb(108 62 193 / 0.045) 0 1px, transparent 1px 34px),
          repeating-linear-gradient(-45deg, rgb(108 62 193 / 0.045) 0 1px, transparent 1px 34px);
        background-size: 48px 48px;
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }

      .patch {
        background-color: var(--paper);
        border: 2px dashed var(--ink-soft);
        border-radius: 0.75rem;
        box-shadow: 4px 5px 0 rgb(42 32 80 / 0.12);
        transform: rotate(1.1deg);
        width: 100%;
        max-width: 34rem;
        text-align: center;
        overflow: hidden;
      }

      .quilt-binding {
        height: 10px;
        margin: -1px -1px 0;
        background-image: repeating-linear-gradient(
          90deg,
          var(--grape)  0 26px,
          var(--violet) 26px 52px,
          var(--sky)    52px 78px,
          var(--teal)   78px 104px,
          var(--orchid) 104px 130px
        );
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25);
        position: relative;
      }

      .quilt-binding::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(90deg, rgb(255 255 255 / 0.5) 0 4px, transparent 4px 10px);
        opacity: 0.5;
        mix-blend-mode: overlay;
      }

      .patch-body {
        padding: 40px 32px 44px;
      }

      .eyebrow {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.025em;
        color: var(--grape);
        margin-bottom: 20px;
      }

      .rosette {
        display: inline-block;
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        background:
          radial-gradient(circle at 50% 27%, var(--grape) 0 22%, transparent 23%),
          radial-gradient(circle at 27% 63%, var(--violet) 0 22%, transparent 23%),
          radial-gradient(circle at 73% 63%, var(--sky) 0 22%, transparent 23%),
          radial-gradient(circle at 50% 50%, var(--teal) 0 20%, transparent 21%);
      }

      .code {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 56px;
        line-height: 1;
        color: var(--grape);
        margin-bottom: 12px;
      }

      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 28px;
        line-height: 1.25;
        color: var(--ink);
        margin-bottom: 14px;
      }

      .message {
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink-soft);
        max-width: 42ch;
        margin: 0 auto;
      }

      .btn-stitch {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        background-color: var(--grape);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        border: 2px dashed rgb(255 255 255 / 0.55);
        border-radius: 0.6rem;
        padding: 0.65rem 1.25rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }

      .btn-stitch:hover {
        background-color: #5a31a6;
        transform: translateY(-1px);
        box-shadow: 3px 4px 0 rgb(42 32 80 / 0.18);
      }

      .btn-stitch:focus-visible {
        outline: 3px solid var(--violet);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .btn-stitch { transition: none; }
        .btn-stitch:hover { transform: none; }
      }

      @media (max-width: 600px) {
        .patch-body { padding: 32px 20px 36px; }
        .code { font-size: 44px; }
        h1 { font-size: 24px; }
      }
    </style>
  </head>

  <body>
    <main class="patch">
      <div class="quilt-binding" aria-hidden="true"></div>
      <div class="patch-body">
        <p class="eyebrow"><span class="rosette" aria-hidden="true"></span> Weave · Patchwork Labs</p>
        <p class="code">404</p>
        <h1>This patch isn&rsquo;t in the quilt.</h1>
        <p class="message">The page you&rsquo;re looking for doesn&rsquo;t exist or may have been moved.</p>
        <a class="btn-stitch" href="/">Back to home</a>
      </div>
    </main>
  </body>
</html>
