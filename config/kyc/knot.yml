# Values for the Knot and the program grants it records (see KnotSettings and
# docs/KYC.md). Values marked LOCKED were decided on 2026-10-12. Counsel and
# the program leads can still change them here: no code change is necessary.
shared: &shared
  # How long Weave keeps a Knot. Null means for ever: a Knot has no expiry,
  # and no job deletes it. A program's lifetime grant cap and the blacklist
  # flag (which never fades) both depend on it. LOCKED (2026-10-13).
  keep_years: ~ # LOCKED: kept for ever

  # Countries whose passport and national identity card both show one
  # national identity number for life (Poland's PESEL, for example). For an
  # ID from one of these countries, the verifier must type the number, or
  # confirm that this document does not show it. The number gives a strong
  # hash that matches across the person's documents from that country.
  # Add a country only when its number never changes.
  lifetime_national_id_countries:
    - BE # National register number
    - EE # Personal identification code (isikukood)
    - ES # DNI number
    - FI # Personal identity code (henkilötunnus)
    - LT # Personal code (asmens kodas)
    - LV # Personal code (personas kods)
    - NL # Citizen service number (BSN)
    - "NO" # National identity number (fødselsnummer)
    - PL # PESEL
    - SE # Personal identity number (personnummer)

  # Programs that give grants. Each key is the program key that a
  # ProgramGrant stores.
  programs:
    ganymede:
      name: Project Ganymede
      # The most grants one person (one Knot) can receive from this program,
      # for life. Leave it empty (null) for no cap.
      # No cap (2026-11-03, Adam): a member can hold several approved Ganymede
      # projects, so Ganymede records each grant without a lifetime limit.
      grant_cap: ~
      # The patch lead of a program is a patch_lead role scoped to the
      # program key (see config/roles.yml). The patch lead records grants and
      # asks for a grant over the cap. A board member signs off the override.
      # Ganymede: Adam (migrated from the old patch_lead_p_ids list).

development:
  <<: *shared

test:
  <<: *shared

production:
  <<: *shared
