# Name of your application. Used to uniquely configure containers.
service: idp

# Name of the container image (without registry prefix - server is in registry config)
image: patchworklabsorg/idp

# Deploy to these servers.
servers:
  web:
    hosts:
      - alastor
    # Disable kamal-proxy since we're using Caddy for reverse proxying
    proxy: false
    options:
      # Expose port 3003 on host (maps to Puma's default port 3000), Caddy will reverse proxy to it
      publish:
        - "3003:3000"

# Credentials for GitHub Container Registry
registry:
  server: ghcr.io
  username: patchworklabsorg

  # GitHub Personal Access Token with packages:write permission
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

    # Database connection via Kamal Docker network
    # Kamal accessories are accessible by their accessory name on the kamal network
    DB_HOST: idp-db
    DB_PORT: 5432
    POSTGRES_DB: idp_production
    POSTGRES_USER: idp

    # Redis connection via Kamal Docker network
    REDIS_URL: redis://idp-redis:6379/0

    # Rails configuration
    RAILS_LOG_LEVEL: info
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Use persistent storage volumes
volumes:
  - "idp_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  # Build for ARM64 since alastor is ARM-based
  arch: arm64

  # Pass git SHA to Docker build for version display
  args:
    GIT_SHA: <%= `git rev-parse --short HEAD`.strip %>

# Use jsp user instead of root
ssh:
  user: jsp

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: pgvector/pgvector:pg17
    host: alastor
    network: kamal
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: idp_production
        POSTGRES_USER: idp
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: alastor
    network: kamal
    port: "127.0.0.1:6380:6379"
    cmd: "redis-server --save 60 1 --loglevel warning"
    directories:
      - data:/data
