# Text for the demographics vault (see DemographicsVault). The questions are
# in config/demographics.yml. Each field there needs a label and a label for
# each option here.
en:
  demographics:
    data_page_link: "What we do with your data"
    nav_title: "Demographics for funder reports"
    form:
      title: "Demographics for funder reports"
      intro: "The funders who pay for Patchwork Labs programs ask how many members are in each age band and gender. These questions are optional. You can skip any question, or all of them."
      sealed: "We encrypt your answers before we store them. Weave and the Patchwork Labs team cannot read them, and we cannot show them to you. Only the total counts for all members come out, and we hide counts that are too small to keep a member anonymous."
      age_band: "We also store your age band (for example 16-17), from your birthday. We do not store your birthday with your answers."
      answered: "You answered on %{date}. We cannot show your answers. To change them, answer again: your new answers replace the old ones."
      not_answered: "You have not answered yet."
      self_description: "Describe it in your own words (optional)"
      self_description_hint: "Reports count this only as \"self-described\". We never show the text."
      consent: "I agree that Patchwork Labs stores these answers, encrypted, and counts them in reports for funders."
      consent_error: "Tick the box to agree before you save your answers."
      invalid: "Pick one of the options."
      submit: "Save my answers"
      withdraw_title: "Take your answers back"
      withdraw_body: "We delete your encrypted answers. Reports made after this do not count you."
      withdraw: "Delete my answers"
      withdraw_confirm: "Delete your demographics answers?"
      saved: "We saved your answers. Thank you."
      withdrawn: "We deleted your demographics answers."
      unavailable: "Demographics questions are not available yet. Try again later."
      impersonating: "You cannot change a member's demographics while you impersonate them."
    prompt:
      title: "Help us report to our funders (optional)"
      body: "Answer a few demographics questions. Your answers are encrypted, and only total counts come out."
      answered: "You answered the demographics questions. You can change or delete your answers."
      link: "Answer the questions"
      manage: "Change or delete"
    options:
      prefer_not_to_say: "Prefer not to say"
      self_describe: "I describe it differently"
      not_answered: "Not answered"
    fields:
      gender_identity:
        label: "Which word describes your gender best?"
        options:
          woman: "Woman"
          man: "Man"
          non_binary: "Non-binary"
      age_band:
        label: "Age band"
    age_bands:
      under: "Under %{age}"
      range: "%{from} to %{to}"
      open: "%{from} and older"
  funder_consents:
    title: "Funders that ask for your consent"
    intro: "Some funders may count you in their report only if you agree. They get totals only, never your answers or your name. You can change this at any time. Reports made after a change follow it."
    counted: "you agree to be counted in their totals."
    not_counted: "you are not counted in their totals."
    give: "Count me in their totals"
    withdraw: "Stop counting me"
    given: "%{funder} can now count you in their totals."
    withdrawn: "%{funder} no longer counts you in their totals."
    unknown: "This funder does not ask for consent."
    impersonating: "You cannot change a member's consent while you impersonate them."
