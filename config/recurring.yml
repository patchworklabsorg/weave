# Slack bidirectional sync - runs every 6 hours
slack_sync_bidirectional:
  command: "SlackSyncJob.perform_later(direction: 'both')"
  schedule: every 6 hours

# Remove group memberships whose expiry has passed. They already grant nothing;
# this keeps the member lists accurate and records the removal.
expire_group_memberships:
  class: ExpireGroupMembershipsJob
  schedule: every 15 minutes

# Delete guardian consents past their retention period (see
# GuardianConsent::KEEP_AFTER_ACCOUNT_DELETION and KEEP_UNANSWERED).
purge_guardian_consents:
  class: PurgeGuardianConsentsJob
  schedule: every day at 4am

# Repair drift in the system groups (staff, board, ...). User callbacks keep
# them in sync; this catches changes that skipped callbacks.
sync_system_groups:
  class: SyncSystemGroupsJob
  schedule: every hour

# Remind Slack guests stuck in #start-here to accept the code of conduct.
nudge_stuck_slack_guests:
  class: NudgeStuckSlackGuestsJob
  schedule: every day at 3pm

# Delete stored ID images when their time is up (see
# PurgeVerificationDocumentsJob and config/kyc/verification.yml).
purge_verification_documents:
  class: PurgeVerificationDocumentsJob
  schedule: every day at 4:30am

# Send break-glass notices that are due, such as the member notice after its
# window (see BreakGlass). Each decryption also enqueues it at once.
deliver_break_glass_notices:
  class: DeliverBreakGlassNoticesJob
  schedule: every 15 minutes

# Email the board the break-glass report for the previous month.
break_glass_board_report:
  class: BreakGlassBoardReportJob
  schedule: "0 9 1 * *"

# Apply the data retention windows: verification audit records, financial
# anonymization, funder-required records, guardian contact of adults and
# expired takeout files (see DataRetention::Sweeps and
# config/kyc/data_retention.yml).
data_retention:
  class: DataRetentionJob
  schedule: every day at 5am

# Warn dormant accounts and send them to the deletion review after the
# dormancy cutoff (see DormancyJob).
dormancy:
  class: DormancyJob
  schedule: every day at 5:30am

# Remind the identity team leads of deletion requests past their review date.
deletion_review_reminder:
  class: DeletionReviewReminderJob
  schedule: every day at 9am

# Mark identity team proposals past their expiry as expired (see
# IdentityGovernance and config/kyc/identity_governance.yml).
expire_identity_governance_proposals:
  class: ExpireIdentityGovernanceProposalsJob
  schedule: every hour

# Delete each key custody share that waited longer than
# pending_share_minutes, and old WebAuthn challenges (see
# KeyCustody::PendingShares).
sweep_pending_shares:
  class: SweepPendingSharesJob
  schedule: every minute
