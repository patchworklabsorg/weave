default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 7 } %>
  url: <%= ENV['DATABASE_URL'] %>

development:
  primary: &primary_development
    <<: *default
    database: patchwork-idp_development
  queue:
    <<: *primary_development
    database: patchwork-idp_development_queue
    migrations_paths: db/queue_migrate

test:
  primary: &primary_test
    <<: *default
    host: localhost
    database: patchwork-idp_test
  queue:
    <<: *primary_test
    host: localhost
    database: patchwork-idp_test_queue
    migrations_paths: db/queue_migrate

production:
  primary: &primary_production
    <<: *default
    host: <%= ENV.fetch('DB_HOST') { 'idp-db' } %>
    port: <%= ENV.fetch('DB_PORT') { 5432 } %>
    database: <%= ENV.fetch('POSTGRES_DB') { 'idp_production' } %>
    username: <%= ENV.fetch('POSTGRES_USER') { 'idp' } %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
  queue:
    <<: *primary_production
    database: <%= ENV.fetch('POSTGRES_DB') { 'idp_production' } %>_queue
    migrations_paths: db/queue_migrate

staging:
  primary: &primary_staging
    <<: *default
    host: <%= ENV.fetch('DB_HOST') { 'idp-db' } %>
    port: <%= ENV.fetch('DB_PORT') { 5432 } %>
    database: <%= ENV.fetch('POSTGRES_DB') { 'idp_staging' } %>
    username: <%= ENV.fetch('POSTGRES_USER') { 'idp' } %>
    password: <%= ENV['POSTGRES_PASSWORD'] %>
  queue:
    <<: *primary_staging
    database: <%= ENV.fetch('POSTGRES_DB') { 'idp_staging' } %>_queue
    migrations_paths: db/queue_migrate
